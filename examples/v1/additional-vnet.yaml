# [EXPERIMENTAL, UNSUPPORTED BY AKS] This example provisions nodes in a VNet other than the cluster VNet,
# on a cluster that uses Azure CNI Overlay with the Cilium dataplane and a VM-based provision mode.
#
# AKS does not program the overlay pod network for nodes outside the cluster VNet, so the azure-cns
# DaemonSet never writes the CNI configuration there and the nodes stay NotReady. AKS does still reserve
# a pod CIDR for each of them in its NodeNetworkConfig. The DaemonSet below writes the same Cilium CNI
# configuration AKS uses, but with the host-local IPAM plugin allocating from that reserved pod CIDR.
#
# Prerequisites:
# - Karpenter runs with --additional-vnets (ADDITIONAL_VNETS) listing the VNet and its location.
# - The VNet is peered with the cluster VNet, and its subnet has its own outbound connectivity
#   (for example a NAT gateway) and network security group. hack/azure/additional-vnets.bicep
#   creates such VNets and outputs the value for --additional-vnets.
# - Pod traffic between nodes in different VNets is carried by WireGuard, so that Azure only sees
#   traffic between node IPs and no routes for pod CIDRs are needed:
#     az aks update --resource-group <resource-group> --name <cluster> --enable-acns \
#       --acns-transit-encryption-type WireGuard --output none
# - Replace the vnetSubnetID below.
#
# Limitations: WireGuard only carries traffic that starts and ends in a pod. Between different VNets:
# - Nodes and host-network pods cannot reach pods, directly or through a Service.
# - NodePort and LoadBalancer Services with externalTrafficPolicy: Cluster cannot forward to pods.
#   Keep the pods of such Services in the VNet where the traffic enters.
# - DNS fails for pods on these nodes that are selected by a network policy with DNS rules (toFQDNs):
#   the DNS proxy on the node forwards their queries from the host network. For the same reason
#   leave spec.localDNS unset (not tested).
# Cilium node encryption (encrypt-node) would lift these limits. It is not used here: it needs an edit
# to the AKS-managed cilium-config, fragments traffic between nodes, and is deprecated in Cilium.
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: additional-vnet
  annotations:
    kubernetes.io/description: "NodePool for nodes in a VNet other than the cluster VNet"
spec:
  template:
    metadata:
      labels:
        # required for Karpenter to predict overhead from cilium DaemonSet
        kubernetes.azure.com/ebpf-dataplane: cilium
        # selects the nodes that get the host-local CNI configuration below
        additional-vnet: "true"
        # the cluster load balancers only accept backends from the cluster VNet
        node.kubernetes.io/exclude-from-external-load-balancers: "true"
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: additional-vnet
      startupTaints:
      # https://karpenter.sh/docs/concepts/nodepools/#cilium-startup-taint
      - key: node.cilium.io/agent-not-ready
        effect: NoExecute
        value: "true"
      expireAfter: Never
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values: ["amd64"]
      - key: kubernetes.io/os
        operator: In
        values: ["linux"]
      - key: karpenter.sh/capacity-type
        operator: In
        values: ["on-demand"]
      - key: karpenter.azure.com/sku-family
        operator: In
        values: [D]
---
apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: additional-vnet
  annotations:
    kubernetes.io/description: "AKSNodeClass for nodes in a VNet other than the cluster VNet"
spec:
  imageFamily: Ubuntu
  vnetSubnetID: /subscriptions/<subscription-id>/resourceGroups/<resource-group>/providers/Microsoft.Network/virtualNetworks/<vnet>/subnets/<subnet>
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: additional-vnet-cni
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: additional-vnet-cni
  namespace: kube-system
rules:
- apiGroups: ["acn.azure.com"]
  resources: ["nodenetworkconfigs"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: additional-vnet-cni
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: additional-vnet-cni
subjects:
- kind: ServiceAccount
  name: additional-vnet-cni
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: additional-vnet-cni
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: additional-vnet-cni
  template:
    metadata:
      labels:
        app: additional-vnet-cni
    spec:
      serviceAccountName: additional-vnet-cni
      priorityClassName: system-node-critical
      # the pod network is not available until this pod has done its work
      hostNetwork: true
      nodeSelector:
        additional-vnet: "true"
      tolerations:
      - operator: Exists
      containers:
      - name: cni-config
        # any image with sh, curl, sed and grep works
        image: mcr.microsoft.com/azurelinux/base/core:3.0
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        command:
        - /bin/sh
        - -c
        - |
          set -u
          conf=/host/etc/cni/net.d/05-cilium.conflist
          # the pod CIDR this node was set up with; the container runtime ignores this file
          state=/host/etc/cni/net.d/additional-vnet-cni.subnet
          sa=/var/run/secrets/kubernetes.io/serviceaccount
          url="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}/apis/acn.azure.com/v1alpha/namespaces/kube-system/nodenetworkconfigs/${NODE_NAME}"
          write() {
            printf '{\n\t"cniVersion": "0.3.1",\n\t"name": "cilium",\n\t"plugins": [\n\t\t{\n\t\t\t"type": "cilium-cni",\n\t\t\t"ipam": {\n\t\t\t\t"type": "host-local",\n\t\t\t\t"ranges": [[{"subnet": "%s"}]]\n\t\t\t},\n\t\t\t"log-file": "/var/log/cilium-cni.log"\n\t\t}\n\t]\n}\n' "$1" > "$conf.tmp" &&
              mv "$conf.tmp" "$conf"
          }
          while true; do
            reserved=$(curl -sS -f --max-time 10 --cacert "$sa/ca.crt" -H "Authorization: Bearer $(cat "$sa/token")" "$url" |
              grep -o '"primaryIP": *"[^"]*"' | sed 's/.*"\([^"]*\)"$/\1/')
            # anything but a single CIDR is not usable
            case "$reserved" in *[!0-9./]*) reserved="" ;; esac
            if [ -f "$state" ]; then
              # A node keeps the pod CIDR and the IPAM plugin it started with, because its pods have
              # addresses from them: restore the file if something else replaced it, and never follow
              # a change of the reserved pod CIDR.
              subnet=$(cat "$state")
              if ! grep -q "\"$subnet\"" "$conf" 2>/dev/null; then
                write "$subnet" && echo "restored $conf with host-local range $subnet"
              fi
              if [ -n "$reserved" ] && [ "$reserved" != "$subnet" ]; then
                echo "ERROR: the pod CIDR reserved for ${NODE_NAME} changed from $subnet to $reserved; replace the node"
                rm -f /tmp/ready
              else
                touch /tmp/ready
              fi
            elif grep -q '"azure-ipam"' "$conf" 2>/dev/null; then
              # azure-cns wrote the file first: that node has a working overlay network
              touch /tmp/ready
            elif [ -n "$reserved" ]; then
              write "$reserved" && echo "$reserved" > "$state" && touch /tmp/ready &&
                echo "wrote $conf with host-local range $reserved"
            else
              echo "no pod CIDR reserved for ${NODE_NAME} yet"
            fi
            sleep 30
          done
        # not ready means the node has no CNI configuration yet, or its reserved pod CIDR changed
        readinessProbe:
          exec:
            command: ["test", "-f", "/tmp/ready"]
          periodSeconds: 30
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        volumeMounts:
        - name: cni-conf
          mountPath: /host/etc/cni/net.d
      volumes:
      - name: cni-conf
        hostPath:
          path: /etc/cni/net.d
          type: Directory
